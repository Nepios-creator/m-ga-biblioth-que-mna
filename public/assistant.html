<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant biblique — Ministère de la Nouvelle Alliance</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .chat-layout { display: grid; grid-template-columns: 240px 1fr; max-width: 1000px; margin: 0 auto; height: calc(100vh - 140px); min-height: 500px; }
  .sidebar { border-right: 1px solid var(--line); padding: 16px 12px; overflow-y: auto; }
  .sidebar .btn { width: 100%; margin-bottom: 14px; }
  .convo-item { padding: 10px 12px; border-radius: 10px; font-size: 13.5px; cursor: pointer; margin-bottom: 4px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .convo-item:hover, .convo-item.active { background: var(--paper); }
  .convo-item .del { opacity: 0.4; font-size: 12px; }
  .convo-item .del:hover { opacity: 1; }
  .chat-main { display: flex; flex-direction: column; padding: 16px 20px; }
  .chat-box { flex: 1; overflow-y: auto; padding: 10px 4px; }
  .bubble { max-width: 82%; padding: 12px 16px; border-radius: 14px; margin-bottom: 10px; font-size: 14.5px; line-height: 1.5; position: relative; }
  .bubble.user { background: var(--blue); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .bubble.assistant { background: var(--paper); color: var(--ink); border-bottom-left-radius: 4px; white-space: pre-wrap; }
  .bubble-actions { display: flex; gap: 10px; margin: -4px 0 14px 4px; }
  .bubble-actions button { background: none; border: none; font-size: 12px; color: var(--ink-soft); cursor: pointer; padding: 2px 0; }
  .bubble-actions button:hover { color: var(--blue-deep); }
  .bubble.sources { font-size: 11.5px; color: var(--ink-soft); margin-top: -6px; margin-bottom: 12px; background: none; padding: 0; }
  .chat-input-row { display: flex; gap: 10px; padding-top: 10px; }
  .chat-input-row textarea { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-family: inherit; font-size: 14.5px; resize: none; }
  @media (max-width: 720px) { .chat-layout { grid-template-columns: 1fr; height: auto; } .sidebar { border-right: none; border-bottom: 1px solid var(--line); max-height: 160px; } }
</style>
</head>
<body>

<header>
  <div class="brand">Ministère de la <span>Nouvelle Alliance</span></div>
  <nav>
    <a href="/a-propos.html">À propos</a>
    <a href="/catalogue.html">Catalogue</a>
    <a href="/espace-etude.html">Espace d'étude</a>
  </nav>
</header>

<div class="chat-layout">
  <div class="sidebar">
    <button class="btn btn-primary" id="new-convo-btn">+ Nouvelle discussion</button>
    <div id="convo-list"></div>
  </div>
  <div class="chat-main">
    <div class="chat-box" id="chat-box">
      <div class="bubble assistant">Bienvenue ! Je suis l'assistant du Ministère de la Nouvelle Alliance. Posez-moi une question biblique ou spirituelle, ou choisissez « + Nouvelle discussion » pour commencer.</div>
    </div>
    <form class="chat-input-row" id="chat-form">
      <textarea id="chat-input" rows="2" placeholder="Écrivez votre question ici…" required></textarea>
      <button type="submit" class="btn btn-primary" id="chat-send">Envoyer</button>
    </form>
  </div>
</div>

<script>
if (!localStorage.getItem('mna_token')) { window.location.href = '/login.html'; }
const $ = (id) => document.getElementById(id);
const token = localStorage.getItem('mna_token');
const authHeaders = { Authorization: `Bearer ${token}` };
let currentConvoId = null;

async function loadConvoList() {
  const r = await fetch('/api/assistant/conversations', { headers: authHeaders });
  const convos = await r.json();
  $('convo-list').innerHTML = convos.map(c => `
    <div class="convo-item ${c.id === currentConvoId ? 'active' : ''}" data-id="${c.id}">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.title}</span>
      <span class="del" data-id="${c.id}">✕</span>
    </div>
  `).join('') || '<p style="font-size:12.5px;color:var(--ink-soft);">Aucune discussion encore.</p>';

  document.querySelectorAll('.convo-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) return;
      openConvo(Number(el.dataset.id));
    });
  });
  document.querySelectorAll('.del').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Supprimer cette discussion ?')) return;
      await fetch(`/api/assistant/conversations/${el.dataset.id}`, { method: 'DELETE', headers: authHeaders });
      if (currentConvoId === Number(el.dataset.id)) { currentConvoId = null; $('chat-box').innerHTML = ''; }
      loadConvoList();
    });
  });
}

async function openConvo(id) {
  currentConvoId = id;
  const r = await fetch(`/api/assistant/conversations/${id}`, { headers: authHeaders });
  const data = await r.json();
  $('chat-box').innerHTML = data.messages.map(m => renderBubble(m.role, m.content)).join('');
  $('chat-box').scrollTop = $('chat-box').scrollHeight;
  loadConvoList();
}

function renderBubble(role, content) {
  if (role === 'assistant') {
    const safeContent = content.replace(/`/g, '\\`');
    return `
      <div class="bubble assistant">${content}</div>
      <div class="bubble-actions">
        <button onclick="copyText(\`${safeContent}\`)">📋 Copier</button>
        <button onclick="shareText(\`${safeContent}\`)">↗️ Partager</button>
      </div>
    `;
  }
  return `<div class="bubble user">${content}</div>`;
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => alert('Réponse copiée !'));
}
function shareText(text) {
  if (navigator.share) { navigator.share({ text }); }
  else { copyText(text); }
}

$('new-convo-btn').addEventListener('click', async () => {
  const r = await fetch('/api/assistant/conversations', { method: 'POST', headers: authHeaders });
  const convo = await r.json();
  currentConvoId = convo.id;
  $('chat-box').innerHTML = '<div class="bubble assistant">Nouvelle discussion — posez votre question.</div>';
  loadConvoList();
});

$('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = $('chat-input').value.trim();
  if (!question) return;

  if (!currentConvoId) {
    const r = await fetch('/api/assistant/conversations', { method: 'POST', headers: authHeaders });
    const convo = await r.json();
    currentConvoId = convo.id;
    $('chat-box').innerHTML = '';
  }

  $('chat-box').insertAdjacentHTML('beforeend', renderBubble('user', question));
  $('chat-input').value = '';
  $('chat-send').disabled = true;
  $('chat-box').insertAdjacentHTML('beforeend', '<div class="bubble assistant" id="loading-bubble">…</div>');
  $('chat-box').scrollTop = $('chat-box').scrollHeight;

  try {
    const r = await fetch(`/api/assistant/conversations/${currentConvoId}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders },
      body: JSON.stringify({ question }),
    });
    const data = await r.json();
    document.getElementById('loading-bubble').remove();
    if (!r.ok) {
      $('chat-box').insertAdjacentHTML('beforeend', renderBubble('assistant', data.message || 'Une erreur est survenue.'));
    } else {
      $('chat-box').insertAdjacentHTML('beforeend', renderBubble('assistant', data.answer));
      if (data.sources && data.sources.length) {
        $('chat-box').insertAdjacentHTML('beforeend', `<div class="bubble sources">Sources : ${data.sources.join(', ')}</div>`);
      }
    }
  } catch (err) {
    document.getElementById('loading-bubble').remove();
    $('chat-box').insertAdjacentHTML('beforeend', renderBubble('assistant', 'Erreur de connexion à l\'assistant.'));
  }
  $('chat-send').disabled = false;
  $('chat-box').scrollTop = $('chat-box').scrollHeight;
  loadConvoList();
});

loadConvoList();
</script>

</body>
</html>
