<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue — Grande Bibliothèque numérique MNA</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="brand"><a href="/">Ministère de la <span>Nouvelle Alliance</span></a></div>
  <nav>
    <a href="/a-propos.html">À propos</a>
    <a href="/catalogue.html">Catalogue</a>
    <a href="/espace-etude.html">Espace d'étude</a>
    <a href="/assistant.html">Assistant IA</a>
    <a href="/login.html">Connexion</a>
  </nav>
</header>

<section class="hero">
  <h1>Catalogue</h1>
  <p>Les livres apparaîtront ici automatiquement dès qu'ils seront ajoutés depuis l'espace admin.</p>
</section>

<div class="container">
  <div class="grid" id="books-grid">
    <div class="card"><p>Chargement du catalogue…</p></div>
  </div>
</div>

<footer>Grande Bibliothèque numérique MNA — © 2026</footer>

<script>
if (!localStorage.getItem('mna_token')) { window.location.href = '/login.html'; }

fetch('/api/books')
  .then(r => r.json())
  .then(books => {
    const grid = document.getElementById('books-grid');
    if (!books.length) {
      grid.innerHTML = '<div class="card"><p>Aucun livre publié pour le moment.</p></div>';
      return;
    }
    grid.innerHTML = books.map(b => `
      <div class="book-card">
        <div class="cover" style="padding:0;"><img src="/api/books/${b.id}/cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" style="width:100%;height:100%;object-fit:cover;"><span style="display:none;width:100%;height:100%;align-items:center;justify-content:center;">📘</span></div>
        <div class="body">
          <h3>${b.title}</h3>
          <div class="meta">${b.author || ''}</div>
          <p>${b.description || ''}</p>
          ${b.access_type === 'a_vendre' ? `
            <div style="font-weight:700;color:var(--gold-deep);margin-bottom:10px;">${b.price ? Number(b.price).toFixed(2) + ' $' : 'Prix sur demande'}</div>
            <div class="actions">
              <a href="https://wa.me/243999983163?text=${encodeURIComponent('Bonjour, je souhaite acheter le livre : ' + b.title)}" target="_blank" class="btn btn-primary">Acheter via WhatsApp</a>
            </div>
          ` : `
            <div class="actions">
              <a href="/api/books/${b.id}/read" target="_blank" class="btn btn-primary">Lire</a>
              ${b.access_type === 'telechargeable' ? `<a href="/api/books/${b.id}/download" class="btn btn-ghost">Télécharger</a>` : ''}
            </div>
          `}
        </div>
      </div>
    `).join('');
  })
  .catch(() => {
    document.getElementById('books-grid').innerHTML = '<div class="card"><p>Impossible de charger le catalogue pour le moment.</p></div>';
  });
</script>

</body>
</html>
