<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Bible en 90 jours — Ministère de la Nouvelle Alliance</title>
<meta name="description" content="Lisez la Bible « Parole pure » en 90 jours, un petit passage chaque jour.">
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16130f">
<style>
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 80px; }
  .wrap h1 { font-size: clamp(26px, 6.5vw, 36px); font-weight: 500; text-align: center; color: var(--gold-deep); margin-bottom: 8px; }
  .intro { text-align: center; color: var(--ink-soft); margin: 0 auto 22px; max-width: 520px; }
  .box { background: var(--mna-card, #fff); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .day-n { font: 500 15px 'Inter', sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-deep); text-align: center; }
  .read-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 18px; }
  .read-list a { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: 2px solid var(--blue); border-radius: 12px; font: 600 17px 'Inter', sans-serif; color: var(--blue-deep); }
  .bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 10px 0 6px; }
  .bar > i { display: block; height: 100%; background: var(--gold-deep); border-radius: 999px; transition: width .4s; }
  .small { font-size: 14px; color: var(--ink-soft); text-align: center; }
  .btn { width: 100%; text-align: center; border: 0; cursor: pointer; font-family: inherit; }
  .btn-ghost { border: 2px solid var(--blue); }
  .link { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font: 14px 'Inter', sans-serif; display: block; margin: 14px auto 0; }
  details.all summary { cursor: pointer; font-weight: 600; color: var(--blue-deep); text-align: center; list-style: none; }
  .row { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row:last-child { border-bottom: 0; }
  .row .d { flex: none; width: 64px; font-weight: 700; color: var(--gold-deep); }
  .row.ok .t { text-decoration: line-through; opacity: .6; }
  .row .ck { margin-left: auto; color: #2a7a44; font-weight: 700; }
  .row.now { background: rgba(201,162,75,.15); border-radius: 8px; padding-left: 8px; }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="/">Ministère de la <span>Nouvelle Alliance</span></a></div>
  <nav>
    <a href="/a-propos.html">À propos</a>
    <a href="/catalogue.html">Catalogue</a>
    <a href="/espace-etude.html">Espace d'étude</a>
    <a href="/login.html">Mon compte</a>
  </nav>
</header>

<main class="wrap">
  <h1>La Bible en 90 jours</h1>
  <p class="intro">Un petit passage de la Bible « Parole pure » chaque jour. Votre progression est gardée sur cet appareil.</p>
  <div id="app"><div class="box">Chargement du plan…</div></div>
</main>

<footer>Ministère de la Nouvelle Alliance — © 2026</footer>

<script>
const token = localStorage.getItem('mna_token');
if (!token) location.href = '/login.html';
const KEY = 'mna_plan90';
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let plan = { start: null, done: [] };
try { Object.assign(plan, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => localStorage.setItem(KEY, JSON.stringify(plan));
let flat = [], days = [];

// Le jour 1 est celui où l'on commence ; les jours s'écoulent à minuit
const dayStamp = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const todayStr = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
const currentDay = () => Math.min(90, Math.max(1, Math.round((dayStamp(todayStr()) - dayStamp(plan.start)) / 864e5) + 1));

// Regroupe « Genèse 1, 2, 3 » en « Genèse 1–3 »
function label(chs) {
  const out = []; let i = 0;
  while (i < chs.length) {
    let j = i;
    while (j + 1 < chs.length && chs[j + 1].b === chs[i].b && chs[j + 1].c === chs[j].c + 1) j++;
    out.push(esc(chs[i].name) + ' ' + chs[i].c + (j > i ? '–' + chs[j].c : ''));
    i = j + 1;
  }
  return out.join(' · ') || 'Repos / rattrapage';
}

function render() {
  if (!flat.length) { $('app').innerHTML = '<div class="box small">La Bible sera mise en ligne progressivement. Le plan apparaîtra dès qu\'un premier livre sera publié.</div>'; return; }
  const doneN = plan.done.length;
  const bar = `<div class="bar"><i style="width:${Math.round(doneN / 90 * 100)}%"></i></div><div class="small">${doneN} jour${doneN > 1 ? 's' : ''} lu${doneN > 1 ? 's' : ''} sur 90</div>`;
  if (!plan.start) {
    $('app').innerHTML = `<div class="box"><p class="small" style="margin:0 0 14px;">${flat.length} chapitres actuellement en ligne, répartis sur 90 jours. Si de nouveaux livres sont publiés, le plan se met à jour.</p>
      <button class="btn btn-primary" id="go">Commencer aujourd'hui</button></div>`;
    $('go').onclick = () => { plan.start = todayStr(); plan.done = []; save(); render(); };
    return;
  }
  const cur = currentDay();
  let next = 1; while (next <= 90 && plan.done.includes(next)) next++;
  const shown = Math.min(next, 90);
  const late = Math.max(0, cur - next);
  const finished = next > 90;
  let html = '';
  if (finished) {
    html += `<div class="box"><div class="day-n">Félicitations</div><p style="text-align:center;font-size:18px;">Vous avez terminé la Bible en 90 jours.</p>${bar}</div>`;
  } else {
    const chs = days[shown - 1];
    html += `<div class="box"><div class="day-n">Jour ${shown} sur 90</div>
      <div class="read-list">${chs.length ? chs.map((x) => `<a href="/bible.html?livre=${x.b}&chapitre=${x.c}"><span>${esc(x.name)} ${x.c}</span><span>Lire ›</span></a>`).join('') : '<p class="small">Jour de repos ou de rattrapage.</p>'}</div>
      <button class="btn btn-primary" id="done">J'ai lu ce jour ✓</button>
      ${late ? `<p class="small" style="margin:12px 0 0;">Vous avez ${late} jour${late > 1 ? 's' : ''} de retard : lisez à votre rythme, le plan vous attend.</p>` : ''}
      ${bar}</div>`;
  }
  html += `<div class="box"><details class="all"><summary>Voir les 90 jours</summary><div style="margin-top:10px;">${days.map((chs, k) => {
    const d = k + 1, ok = plan.done.includes(d);
    return `<div class="row${ok ? ' ok' : ''}${d === shown && !finished ? ' now' : ''}"><span class="d">Jour ${d}</span><span class="t">${label(chs)}</span>${ok ? '<span class="ck">✓</span>' : ''}</div>`;
  }).join('')}</div></details><button class="link" id="reset">Recommencer le plan</button></div>`;
  $('app').innerHTML = html;
  const dn = $('done');
  if (dn) dn.onclick = () => { if (!plan.done.includes(shown)) plan.done.push(shown); save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('reset').onclick = () => { if (confirm('Recommencer le plan à zéro ?')) { plan = { start: null, done: [] }; save(); render(); } };
}

(async function () {
  try {
    const r = await fetch('/api/bible/books', { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { location.href = '/login.html'; return; }
    const books = r.ok ? await r.json() : [];
    books.forEach((b) => b.chapters.forEach((c) => flat.push({ b: b.id, name: b.name, c })));
    const N = flat.length;
    for (let d = 1; d <= 90; d++) days.push(flat.slice(Math.floor((d - 1) * N / 90), Math.floor(d * N / 90)));
  } catch (e) { $('app').innerHTML = '<div class="box small">Impossible de charger le plan pour le moment.</div>'; return; }
  render();
})();
</script>
<script src="/js/pwa.js"></script>
</body>
</html>
