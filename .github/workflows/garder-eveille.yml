name: Garder le site éveillé

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visiter le site
        run: |
          curl --silent --show-error --fail \
            --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            https://mega-bibliotheque-mna.onrender.com/api/health
